spring:
  application:
    name: aiagentos
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:./aiagentos.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always

aiagentos:
  providers: []
  profiles:
    directory: ${AIAGENTOS_PROFILE_DIR:.aiagentos/profiles}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: aiagentos

springdoc:
  swagger-ui:
    path: /swagger-ui.html

info:
  app:
    name: aiagentos
    version: 0.1.0-SNAPSHOT
